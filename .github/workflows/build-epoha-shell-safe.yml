name: Build Epoha Shell 0.6.1 Unified Glass

on:
  push:
    branches:
      - build/epoha-shell-prototype
  pull_request:
  workflow_dispatch:

jobs:
  build-safe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable .NET Framework 3.5
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework\v3.5\csc.exe"
          if (-not (Test-Path $csc)) {
            Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart
          }
          if (-not (Test-Path $csc)) { throw "csc.exe v3.5 not found" }

      - name: Prepare 0.6.1 source
        shell: powershell
        run: |
          .\build_v061.ps1

      - name: Compile Win7 x86 UTF8
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path out-safe | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework\v3.5\csc.exe" /nologo /codepage:65001 /target:winexe /optimize+ /platform:x86 /out:out-safe\EpohaShell-0.6.1-WIN7.exe /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Xml.dll ProgramV061Build.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash out-safe\EpohaShell-0.6.1-WIN7.exe -Algorithm SHA256 | Format-List

      - name: Package
        shell: powershell
        run: |
          @'
          EPOHA SHELL 0.6.1 - UNIFIED GLASS
          - one shared transparency control for header and left menu
          - permanent dark tint under glass so bright wallpapers do not wash out navigation
          - simplified Appearance page with fewer controls
          - softer game-card borders and highlights
          - retains 0.6.0 club-mode and service controls
          - compatible with existing config-v050.xml
          Admin password: 2000
          Emergency admin hotkey: Ctrl+Alt+E
          '@ | Set-Content -Encoding ASCII out-safe\README.txt
          Compress-Archive -Path out-safe\* -DestinationPath EpohaShell-0.6.1-WIN7.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EpohaShell-0.6.1-WIN7
          path: |
            out-safe/EpohaShell-0.6.1-WIN7.exe
            EpohaShell-0.6.1-WIN7.zip
