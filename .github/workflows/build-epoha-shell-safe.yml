name: Build Epoha Shell 0.5.0 Glass 2010

on:
  push:
    branches:
      - build/epoha-shell-prototype
  pull_request:
  workflow_dispatch:

jobs:
  build-safe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable .NET Framework 3.5
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework\v3.5\csc.exe"
          if (-not (Test-Path $csc)) {
            Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart
          }
          if (-not (Test-Path $csc)) { throw "csc.exe v3.5 not found" }

      - name: Prepare 0.5.0 source
        shell: powershell
        run: |
          .\build_v050.ps1

      - name: Compile Win7 x86 UTF8
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path out-safe | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework\v3.5\csc.exe" /nologo /codepage:65001 /target:winexe /optimize+ /platform:x86 /out:out-safe\EpohaShell-0.5.0-WIN7.exe /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Xml.dll ProgramV050Build.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash out-safe\EpohaShell-0.5.0-WIN7.exe -Algorithm SHA256 | Format-List

      - name: Package
        shell: powershell
        run: |
          @'
          EPOHA SHELL 0.5.0 - GLASS 2010
          - full-screen shared wallpaper across work area, header and sidebar
          - adjustable header transparency
          - adjustable sidebar transparency
          - adjustable work-area dimming
          - dark themed TextBox, ComboBox, ListBox and NumericUpDown controls
          - fixed brand layout with full club name and years
          - adjustable sidebar width
          - show/hide date and footer
          - wallpaper Fill / Stretch / Center
          - adaptive card sizes and improved navigation/card gradients
          Admin password: 2000
          Ctrl+Alt+E: admin login
          '@ | Set-Content -Encoding ASCII out-safe\README.txt
          Compress-Archive -Path out-safe\* -DestinationPath EpohaShell-0.5.0-WIN7.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EpohaShell-0.5.0-WIN7
          path: |
            out-safe/EpohaShell-0.5.0-WIN7.exe
            EpohaShell-0.5.0-WIN7.zip
