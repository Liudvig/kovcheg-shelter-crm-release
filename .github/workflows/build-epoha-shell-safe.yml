name: Build Epoha Shell 0.2.0 Cosmic

on:
  push:
    branches:
      - build/epoha-shell-prototype
  pull_request:
  workflow_dispatch:

jobs:
  build-safe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable .NET Framework 3.5
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework\v3.5\csc.exe"
          if (-not (Test-Path $csc)) {
            Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart
          }
          if (-not (Test-Path $csc)) { throw "csc.exe v3.5 not found" }

      - name: Compile Win7 x86 UTF-8
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path out-safe | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework\v3.5\csc.exe" /nologo /codepage:65001 /target:winexe /optimize+ /platform:x86 /out:out-safe\EpohaShell-0.2.0-WIN7.exe /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Xml.dll ProgramSafe.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash out-safe\EpohaShell-0.2.0-WIN7.exe -Algorithm SHA256 | Format-List

      - name: Package
        shell: powershell
        run: |
          @'
          ЭПОХА SHELL 0.2.0
          Windows 7 x86/x64 compatible test build.

          Главное:
          - игровая область физически отделена от левого меню и больше не может заходить под него;
          - новый космический фон и подсветка карточек;
          - адаптивная сетка под 5:4, 16:10, 16:9 и Full HD;
          - полноценная админка: общие настройки, вкладки, игры, внешний вид, система;
          - сохранение конфигурации в %LOCALAPPDATA%\Epoha\config.xml;
          - настройка номера ПК, пароля, вкладок, ярлыков игр, картинок, EXE, параметров запуска;
          - выбор цвета подсветки и размера карточек.

          Пароль первого запуска: 2000
          Ctrl+Alt+E: вход администратора.
          Защитные клубные ограничения Windows пока не включены в этой тестовой сборке.
          '@ | Set-Content -Encoding UTF8 out-safe\README.txt
          Compress-Archive -Path out-safe\* -DestinationPath EpohaShell-0.2.0-WIN7.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EpohaShell-0.2.0-WIN7
          path: |
            out-safe/EpohaShell-0.2.0-WIN7.exe
            EpohaShell-0.2.0-WIN7.zip
