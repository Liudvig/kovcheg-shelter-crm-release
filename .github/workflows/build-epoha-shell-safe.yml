name: Build Epoha Shell 1.1.0 Branded Windows

on:
  push:
    branches:
      - build/epoha-shell-prototype
  pull_request:
  workflow_dispatch:

jobs:
  build-safe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable .NET Framework 3.5
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework\v3.5\csc.exe"
          if (-not (Test-Path $csc)) { Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart }
          if (-not (Test-Path $csc)) { throw "csc.exe v3.5 not found" }

      - name: Prepare 1.1.0 source
        shell: powershell
        run: .\build_v110_fix.ps1

      - name: Compile Win7 x86 UTF8
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path out-safe | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework\v3.5\csc.exe" /nologo /codepage:65001 /target:winexe /optimize+ /platform:x86 /out:out-safe\EpohaShell-1.1.0-WIN7.exe /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Xml.dll ProgramV110Build.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash out-safe\EpohaShell-1.1.0-WIN7.exe -Algorithm SHA256 | Format-List

      - name: Package
        shell: powershell
        run: |
          @'
          EPOHA SHELL 1.1.0 - BRANDED WINDOWS TRANSITIONS
          - stable 1.0.0 club mode retained
          - full-screen EPOHA transition covers the user desktop immediately before shutdown/restart
          - one-click elevated Windows 7 branding installer from Admin > System
          - installs backgroundDefault.jpg for Windows 7 logon/welcome/logoff/secure Winlogon screen
          - enables OEM/custom logon background policy
          - hides Fast User Switching entry points at machine scope
          - Ctrl+Alt+Del remains a protected Windows secure sequence, but the Winlogon background can now match EPOHA
          - lower EPOHA task strip lists visible windows so dialogs cannot disappear behind the shell
          - left-click restores an open window; admin context menu can close it
          - watchdog marker is suspended during intentional shutdown/restart and resumes after next club-mode start
          - Windows 7 x86 / .NET Framework 3.5
          Admin password: 2000
          '@ | Set-Content -Encoding ASCII out-safe\README.txt
          Compress-Archive -Path out-safe\* -DestinationPath EpohaShell-1.1.0-WIN7.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EpohaShell-1.1.0-WIN7
          path: |
            out-safe/EpohaShell-1.1.0-WIN7.exe
            EpohaShell-1.1.0-WIN7.zip
