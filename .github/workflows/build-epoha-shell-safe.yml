name: Build Epoha Shell 1.2.1 Unicode Fix

on:
  push:
    branches:
      - build/epoha-shell-prototype
  pull_request:
  workflow_dispatch:

jobs:
  build-safe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable .NET Framework 3.5
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework\v3.5\csc.exe"
          if (-not (Test-Path $csc)) { Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart }
          if (-not (Test-Path $csc)) { throw "csc.exe v3.5 not found" }

      - name: Prepare 1.2.1 source
        shell: powershell
        run: .\build_v121.ps1

      - name: Compile Win7 x86 UTF8
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path out-safe | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework\v3.5\csc.exe" /nologo /codepage:65001 /target:winexe /optimize+ /platform:x86 /out:out-safe\EpohaShell-1.2.1-WIN7.exe /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Xml.dll ProgramV121Build.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash out-safe\EpohaShell-1.2.1-WIN7.exe -Algorithm SHA256 | Format-List

      - name: Package
        shell: powershell
        run: |
          @'
          EPOHA SHELL 1.2.1 - UNICODE KIOSK UI FIX
          - keeps 1.2.0 system kiosk logic unchanged
          - all newly introduced Russian kiosk captions/messages are emitted as ASCII-safe C# Unicode escapes
          - fixes mojibake on the System Kiosk button and result dialogs under the legacy .NET 3.5 compiler
          - Windows 7 x86 / .NET Framework 3.5 compatible
          Admin password: 2000
          '@ | Set-Content -Encoding ASCII out-safe\README.txt
          Compress-Archive -Path out-safe\* -DestinationPath EpohaShell-1.2.1-WIN7.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EpohaShell-1.2.1-WIN7
          path: |
            out-safe/EpohaShell-1.2.1-WIN7.exe
            EpohaShell-1.2.1-WIN7.zip
