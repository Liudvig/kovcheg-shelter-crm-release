name: Build Epoha Shell 0.6.0 Club UI

on:
  push:
    branches:
      - build/epoha-shell-prototype
  pull_request:
  workflow_dispatch:

jobs:
  build-safe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable .NET Framework 3.5
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework\v3.5\csc.exe"
          if (-not (Test-Path $csc)) {
            Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart
          }
          if (-not (Test-Path $csc)) { throw "csc.exe v3.5 not found" }

      - name: Prepare 0.6.0 source
        shell: powershell
        run: |
          .\build_v060.ps1

      - name: Compile Win7 x86 UTF8
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path out-safe | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework\v3.5\csc.exe" /nologo /codepage:65001 /target:winexe /optimize+ /platform:x86 /out:out-safe\EpohaShell-0.6.0-WIN7.exe /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Xml.dll ProgramV060Build.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash out-safe\EpohaShell-0.6.0-WIN7.exe -Algorithm SHA256 | Format-List

      - name: Package
        shell: powershell
        run: |
          @'
          EPOHA SHELL 0.6.0 - CLUB UI
          - clock/date are owner-drawn directly on the shared wallpaper/header; no separate clock plate
          - new rounded 2009-2012 style navigation, action buttons and game cards
          - EXE icon fallback when a game has no cover image
          - optional game-category caption on cards
          - optional seconds and center status display
          - improved status strip without a heavy rectangular frame
          - scrollable admin pages for lower resolutions
          - club mode: Task Manager/secure-screen policy restrictions and Win/Alt key blocking
          - club mode can optionally close Explorer
          - safe admin exit restores policies and Explorer
          - export/import EPOHA configuration for cloning PCs
          - compatible with existing config-v050.xml
          Admin password: 2000
          Emergency admin hotkey: Ctrl+Alt+E
          '@ | Set-Content -Encoding ASCII out-safe\README.txt
          Compress-Archive -Path out-safe\* -DestinationPath EpohaShell-0.6.0-WIN7.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EpohaShell-0.6.0-WIN7
          path: |
            out-safe/EpohaShell-0.6.0-WIN7.exe
            EpohaShell-0.6.0-WIN7.zip
