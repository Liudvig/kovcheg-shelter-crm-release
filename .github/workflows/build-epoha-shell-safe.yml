name: Build Epoha Shell 0.3.0 Polished

on:
  push:
    branches:
      - build/epoha-shell-prototype
  pull_request:
  workflow_dispatch:

jobs:
  build-safe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable .NET Framework 3.5
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework\v3.5\csc.exe"
          if (-not (Test-Path $csc)) {
            Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart
          }
          if (-not (Test-Path $csc)) { throw "csc.exe v3.5 not found" }

      - name: Compile Win7 x86 UTF-8
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path out-safe | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework\v3.5\csc.exe" /nologo /codepage:65001 /target:winexe /optimize+ /platform:x86 /out:out-safe\EpohaShell-0.3.0-WIN7.exe /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Xml.dll ProgramSafe.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash out-safe\EpohaShell-0.3.0-WIN7.exe -Algorithm SHA256 | Format-List

      - name: Package
        shell: powershell
        run: |
          @'
          ЭПОХА SHELL 0.3.0
          Windows 7 x86/x64 compatible test build.

          Изменения:
          - единая двухколоночная разметка без наложения интерфейсов;
          - логотип слева выровнен точно по высоте шапки;
          - двойная буферизация и единичная смена экранов для устранения мерцания;
          - часы больше не вызывают пересборку интерфейса каждую секунду;
          - визуальные кнопки Администратор / Перезагрузка / Выключение в шапке;
          - Администратор удалён из левого меню;
          - новый космический фон и улучшенные карточки игр;
          - поддержка пользовательских обоев с режимами Fill / Stretch / Center;
          - настройка затемнения обоев;
          - настройка цвета интерфейса и размера карточек;
          - полноценные разделы админки: Общие, Внешний вид, Вкладки, Игры и ярлыки, Система;
          - добавление/редактирование EXE, параметров, рабочей папки и изображения игры;
          - изменение порядка вкладок и игр.

          Пароль первого запуска: 2000
          Ctrl+Alt+E: вход администратора.
          Клубные блокировки Windows пока не активируются в этой тестовой сборке.
          '@ | Set-Content -Encoding UTF8 out-safe\README.txt
          Compress-Archive -Path out-safe\* -DestinationPath EpohaShell-0.3.0-WIN7.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EpohaShell-0.3.0-WIN7
          path: |
            out-safe/EpohaShell-0.3.0-WIN7.exe
            EpohaShell-0.3.0-WIN7.zip
